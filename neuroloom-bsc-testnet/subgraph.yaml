specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  # ==========================================
  # VAULT 1: THE YIELD FARM
  # ==========================================
  - kind: ethereum
    name: YieldFarm
    network: chapel
    source:
      address: "0xf25297f1a2d83f738dc32fc5851bdff732c20141"
      abi: NeuroLoomVault
      startBlock: 134493081
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Approval
        - Deposit
        - Initialized
        - Paused
        - RebalanceExecuted
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
        - Transfer
        - Unpaused
        - Upgraded
        - Withdraw
        - ProtocolApproved
      abis:
        - name: NeuroLoomVault
          file: ./abis/NeuroLoomVault.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Initialized(uint64)
          handler: handleInitialized
        - event: Paused(address)
          handler: handlePaused
        - event: RebalanceExecuted(indexed address,indexed address,uint256,uint256)
          handler: handleRebalanceExecuted
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Unpaused(address)
          handler: handleUnpaused
        - event: Upgraded(indexed address)
          handler: handleUpgraded
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: ProtocolApproved(indexed address,bool)
          handler: handleProtocolApproved
      file: ./src/neuro-loom-vault-v-2.ts

